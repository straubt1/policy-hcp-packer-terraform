version: '3'

dotenv: ['.env', 'secrets/.env']

tasks:
  sentinel-test-no-image:
    desc: Run both policies to compare difference
    cmds:
      - sentinel test -run="/test-fail-raw-ami.hcl" policies/aws/enforce-hcp-packer-images-original.sentinel
      - sentinel test -run="/test-fail-raw-ami.hcl" policies/aws/enforce-hcp-packer-images.sentinel

  hcp-list-buckets:
    desc: Get API Response - List HCP Buckets
    vars:
      output_file: api/ListAllBuckets.json
    cmds:
      - |
        mkdir -p $(dirname {{.output_file}})
        HCP_ACCESS_TOKEN=$(curl --silent --show-error --location "https://auth.idp.hashicorp.com/oauth2/token" \
          --header "Content-Type: application/x-www-form-urlencoded" \
          --data-urlencode "client_id=${HCP_CLIENT_ID}" \
          --data-urlencode "client_secret=${HCP_CLIENT_SECRET}" \
          --data-urlencode "grant_type=client_credentials" \
          --data-urlencode "audience=https://api.hashicorp.cloud" | jq -r '.access_token')
        curl --silent --show-error --location "https://api.cloud.hashicorp.com/packer/2023-01-01/organizations/${HCP_ORGANIZATION_ID}/projects/${HCP_PROJECT_ID}/buckets?sorting.order_by=name&pagination.page_size=100" \
          --header "Authorization: Bearer ${HCP_ACCESS_TOKEN}" \
          --header "Content-Type: application/json" | jq . > {{.output_file}}
  
  hcp-list-image-versions:
    desc: Get API Response - List Image Versions for an HCP Bucket
    vars:
      bucket_name: aws-core-ubuntu-2204
      output_file: api/ListAllImageVersions_{{.bucket_name}}.json
    cmds:
      - |
        mkdir -p $(dirname {{.output_file}})
        HCP_ACCESS_TOKEN=$(curl --silent --show-error --location "https://auth.idp.hashicorp.com/oauth2/token" \
          --header "Content-Type: application/x-www-form-urlencoded" \
          --data-urlencode "client_id=${HCP_CLIENT_ID}" \
          --data-urlencode "client_secret=${HCP_CLIENT_SECRET}" \
          --data-urlencode "grant_type=client_credentials" \
          --data-urlencode "audience=https://api.hashicorp.cloud" | jq -r '.access_token')
        curl --silent --show-error --location "https://api.cloud.hashicorp.com/packer/2023-01-01/organizations/${HCP_ORGANIZATION_ID}/projects/${HCP_PROJECT_ID}/buckets/{{.bucket_name}}/versions?sorting.order_by=name&pagination.page_size=100" \
          --header "Authorization: Bearer ${HCP_ACCESS_TOKEN}" \
          --header "Content-Type: application/json" | jq . > {{.output_file}}
  
  

  format:
    desc: Format all files in the repository, ignoring any potential hidden folder ".sentinel/"
    cmds:
      - find . -name "*.sentinel" ! -path "./.sentinel" -exec sentinel fmt {} \;
  test-all:
    cmds:
      - sentinel test -verbose ./policies/*
  test-aws:
    cmds:
      - sentinel test -verbose ./policies/aws/*
  test-azure:
    cmds:
      - sentinel test -verbose ./policies/azure/*
  test-gcp:
    cmds:
      - sentinel test -verbose ./policies/gcp/*
